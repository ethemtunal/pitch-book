services:
  api:
    build: .
    ports:
      - "8000:5000"
    environment:
      DOCUMENT_DB_HOST: mongodb
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
